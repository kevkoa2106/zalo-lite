<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 468" width="880" height="468" role="img" aria-labelledby="sync-title sync-desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="sync-title">Phone-to-PC history transfer</title>
  <desc id="sync-desc">Zalo Lite asks Zalo's servers to pull history from the phone. The phone prompts, the user accepts, the backup is uploaded, and Zalo Lite receives its location and an RSA-wrapped key, downloads it, then decrypts and imports it.</desc>
  <defs>
    <marker id="sync-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#6b7280"/></marker>
    <marker id="sync-arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 Z" fill="#bf4520"/></marker>
  </defs>
  <rect width="880" height="468" fill="#f5f5f5"/>
  <text x="40" y="44" font-size="11" letter-spacing="1.4" fill="#bf4520" font-family="ui-monospace, Menlo, monospace">PHONE SYNC</text>
  <text x="40" y="76" font-size="24" fill="#2d3142" font-family="Georgia, 'Times New Roman', serif">How old history reaches the desktop</text>

  <!-- lifelines -->
  <path d="M140 156 V436" stroke="#d4d4d8" stroke-width="1" stroke-dasharray="4,4"/>
  <path d="M440 156 V436" stroke="#d4d4d8" stroke-width="1" stroke-dasharray="4,4"/>
  <path d="M740 156 V436" stroke="#d4d4d8" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- messages (drawn before boxes) -->
  <path d="M140 196 H436" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#sync-arrow)"/>
  <path d="M440 240 H736" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#sync-arrow)"/>
  <path d="M736 284 H444" stroke="#6b7280" stroke-width="1.5" fill="none" stroke-dasharray="5,4" marker-end="url(#sync-arrow)"/>
  <path d="M436 328 H144" stroke="#bf4520" stroke-width="1.5" fill="none" marker-end="url(#sync-arrow-accent)"/>
  <path d="M140 372 H436" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#sync-arrow)"/>

  <!-- labels on masks, 8px above their strokes -->
  <rect x="236" y="170" width="108" height="16" fill="#f5f5f5"/>
  <text x="290" y="182" font-size="10" text-anchor="middle" fill="#2d3142" font-family="ui-monospace, Menlo, monospace" letter-spacing="0.6">1 ASK FOR HISTORY</text>
  <rect x="544" y="214" width="92" height="16" fill="#f5f5f5"/>
  <text x="590" y="226" font-size="10" text-anchor="middle" fill="#2d3142" font-family="ui-monospace, Menlo, monospace" letter-spacing="0.6">2 SYNC PROMPT</text>
  <rect x="520" y="258" width="140" height="16" fill="#f5f5f5"/>
  <text x="590" y="270" font-size="10" text-anchor="middle" fill="#2d3142" font-family="ui-monospace, Menlo, monospace" letter-spacing="0.6">3 ACCEPT AND UPLOAD</text>
  <rect x="226" y="302" width="128" height="16" fill="#f5f5f5"/>
  <text x="290" y="314" font-size="10" text-anchor="middle" fill="#bf4520" font-family="ui-monospace, Menlo, monospace" letter-spacing="0.6">4 LINK + WRAPPED KEY</text>
  <rect x="236" y="346" width="108" height="16" fill="#f5f5f5"/>
  <text x="290" y="358" font-size="10" text-anchor="middle" fill="#2d3142" font-family="ui-monospace, Menlo, monospace" letter-spacing="0.6">5 DOWNLOAD FILE</text>

  <!-- actors -->
  <rect x="60" y="108" width="160" height="48" rx="6" fill="#fbe9e2" stroke="#bf4520"/>
  <text x="140" y="130" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3142">Zalo Lite</text>
  <text x="140" y="146" font-size="10" text-anchor="middle" fill="#6b7280" font-family="ui-monospace, Menlo, monospace">backend</text>
  <rect x="360" y="108" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142"/>
  <text x="440" y="130" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3142">Zalo servers</text>
  <text x="440" y="146" font-size="10" text-anchor="middle" fill="#6b7280" font-family="ui-monospace, Menlo, monospace">relay + file host</text>
  <rect x="660" y="108" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142"/>
  <text x="740" y="130" font-size="14" font-weight="600" text-anchor="middle" fill="#2d3142">Your phone</text>
  <text x="740" y="146" font-size="10" text-anchor="middle" fill="#6b7280" font-family="ui-monospace, Menlo, monospace">you tap accept</text>

  <!-- local step -->
  <rect x="156" y="392" width="248" height="44" rx="6" fill="#ffffff" stroke="#2d3142"/>
  <text x="168" y="412" font-size="12" font-weight="600" fill="#2d3142">6 Decrypt, map ids, import</text>
  <text x="168" y="427" font-size="10" fill="#6b7280" font-family="ui-monospace, Menlo, monospace">newest 3000 per chat, then delete</text>
</svg>
