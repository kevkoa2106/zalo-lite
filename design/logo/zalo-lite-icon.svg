<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="zl-title">
  <title id="zl-title">Zalo Lite icon, refined</title>
  <defs>
    <linearGradient id="zl-tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f8fff"/><stop offset="1" stop-color="#0058e6"/></linearGradient>
    <linearGradient id="zl-edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/><stop offset="0.35" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
    <linearGradient id="zl-bubble" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#dbe8ff"/></linearGradient>
    <filter id="zl-ground" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000" flood-opacity="0.38"/></filter>
