  <ellipse cx="512" cy="748" rx="168" ry="15" fill="#00265f" opacity="0.45" filter="url(#zl-soft)"/>
  <g transform="translate(512 492) rotate(-6) scale(1.14) translate(-512 -492) translate(0 -22)" filter="url(#zl-lift)">
